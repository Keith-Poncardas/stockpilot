"""
Product Status lifecycle representation.
"""
enum ProductStatus {
  ACTIVE
  INACTIVE
  DISCONTINUED
  DRAFT
  ARCHIVED
}

"""
Product Type representation: single product vs bundle / combo kit.
"""
enum ProductType {
  SIMPLE
  BUNDLE
}

"""
Defines the fields by which products can be ordered.
"""
enum ProductOrderBy {
  createdAt
  name
  unitPrice
}

"""
Aggregated performance metrics for a specific product.
"""
type ProductPerformanceMetrics {
  unitsSold: Int!
  unitsSoldTrend: Float!
  revenue: Float!
  revenueTrend: Float!
  transactions: Int!
  avgPerSale: Float!
  sellThroughRate: Float!
}

"""
Sales trend data point for a product matching sales overview format.
"""
type ProductSalesTrendPoint {
  label: String!
  date: String!
  sales: Float!
  isActive: Boolean!
}

"""
Represents a bundled item linked to a parent product.
"""
type ProductBundleItem {
  id: ID!
  parentProductId: ID!
  bundledProductId: ID!
  quantity: Int!
  product: Product!
}

"""
Represents a volume pricing & free gift tier for a product.
"""
type ProductPricingTier {
  id: ID!
  productId: ID!
  minQuantity: Int!
  maxQuantity: Int
  tierPrice: Float!
  freeProductId: ID
  freeQuantity: Int!
  freeProduct: Product
}

"""
Represents a product item in the inventory catalog.
"""
type Product {
  id: ID!
  sku: String!
  name: String!
  description: String
  unitPrice: Float!
  costPrice: Float
  regularPrice: Float
  productType: ProductType!
  status: ProductStatus!
  createdAt: String!
  updatedAt: String!

  # Relations & Analytics
  inventory: Inventory
  stockMovement: StockMovement
  bundleItems: [ProductBundleItem!]!
  pricingTiers: [ProductPricingTier!]!
  performanceMetrics: ProductPerformanceMetrics!
  salesTrend: [ProductSalesTrendPoint!]!
}

"""
Aggregated metrics and key performance indicators for products.
"""
type ProductMetrics {
  total: Int!
  active: Int!
  draft: Int!
}

"""
Response wrapper for paginated product data, including the list of products and pagination metadata.
"""
type PaginatedProducts {
  data: [Product!]!
  meta: Pagination!
}

"""
Response wrapper for cursor-based infinite scrolling of product search results.
"""
type InfiniteProductsResult {
  data: [Product!]!
  meta: InfiniteScrollMeta!
}

"""
Product Ranked Sales performance summary.
"""
type ProductRankedSales {
  id: ID!
  name: String!
  quantitySold: Int!
  percentage: Float!
  rank: Int!
}

"""
Input parameters for filtering and sorting the product list.
"""
input GetProductsInput {
  search: String
  status: ProductStatus
  productType: ProductType
  stockStatus: String
  minPrice: Float
  maxPrice: Float
  dateFrom: String
  dateTo: String
  orderBy: ProductOrderBy
  orderDirection: OrderDirection
}

"""
Input arguments for fetching a paginated list of products.
"""
input PaginatedProductsInput {
  page: Int!
  limit: Int!
  filter: GetProductsInput!
}

"""
Base mutation payload containing core product attributes.
"""
input BaseProductMutationInput {
  name: String!
  description: String
  sku: String
  unitPrice: Float!
  costPrice: Float
  regularPrice: Float
  productType: ProductType
  status: ProductStatus!
}

"""
Input data representing a bundled product item with its quantity.
"""
input BundleItemInput {
  productId: ID!
  quantity: Int!
}

"""
Input data representing a volume pricing tier and complimentary gift.
"""
input PricingTierInput {
  minQuantity: Int!
  maxQuantity: Int
  tierPrice: Float!
  freeProductId: ID
  freeQuantity: Int
}

"""
Input data required to create a new product and its initial stock.
"""
input CreateProductInput {
  product: BaseProductMutationInput!
  inventory: InventoryInput
  bundleItems: [BundleItemInput!]
  pricingTiers: [PricingTierInput!]
}

"""
Input data required to edit an existing product record.
"""
input EditProductInput {
  productId: ID!
  product: BaseProductMutationInput!
  inventory: InventoryInput
  bundleItems: [BundleItemInput!]
  pricingTiers: [PricingTierInput!]
}

"""
Input data required to change a product's lifecycle status.
"""
input ChangeProductStatusInput {
  productId: ID!
  status: ProductStatus!
}

"""
Input parameters for cursor-based infinite scrolling product searches.
"""
input SearchProductsInfiniteInput {
  search: String!
  cursor: String
  limit: Int
}

type Query {
  getProduct(productId: ID!): Product!
  getProducts(args: PaginatedProductsInput!): PaginatedProducts!
  searchProductsInfinite(input: SearchProductsInfiniteInput!): InfiniteProductsResult!
  getTotalProductsCount: Int!
  getProductMetrics: ProductMetrics!
}

type Mutation {
  createProduct(input: CreateProductInput!): Product!
  editProduct(input: EditProductInput!): Product!
  changeProductStatus(input: ChangeProductStatusInput!): Product!
}
