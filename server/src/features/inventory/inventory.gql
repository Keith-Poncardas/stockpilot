# Stock status filter — maps to the column-to-column comparison logic in getStatuses()
enum StockStatus {
  ALL
  WELL_STOCKED
  LOW_STOCK
  CRITICAL_OUT
}

# Stock status returned on individual inventory records (excludes ALL)
enum StockStatusCustom {
  WELL_STOCKED
  LOW_STOCK
  CRITICAL_OUT
}

# Sortable columns for inventory list queries
enum InventoryOrderBy {
  quantityOnHand
  reorderLevel
  updatedAt
}

# Core inventory record (single item)
type Inventory {
  id: ID!
  productId: ID!
  quantityOnHand: Int!
  reorderLevel: Int!
  maxStock: Int!
  updatedAt: String!
  createdAt: String!
  # Analytics & Computed
  lastRestockDate: String
  estimatedDaysOfStock: Int

  # Relations
  product: Product!
  author: User!
}

# Counts grouped by stock status — returned by getInventoryStatuses
type InventoryStatuses {
  wellStocked: Int!
  lowStock: Int!
  criticalOut: Int!
  belowReorderLevel: Int!
}

# Paginated inventory list response
type PaginatedInventories {
  data: [Inventory!]!
  meta: Pagination!
}

# Inventory Filter Input Type
input InventoryFilterInput {
  search: String
  stockStatus: StockStatus
  minQty: Int
  maxQty: Int
  minReorderLevel: Int
  maxReorderLevel: Int
  orderBy: InventoryOrderBy
  orderDirection: OrderDirection
}

# Get Inventories Input Type
input GetInventoriesInput {
  page: Int
  limit: Int
  filter: InventoryFilterInput
}

# Adjust Stock Input Type
input AdjustStockInput {
  inventoryId: ID!
  movement: StockMovementInput
}

# Inventory Input Type
input InventoryInput {
  quantityOnHand: Int
  reorderLevel: Int
  maxStock: Int
}

# Create Inventory Input Type
input CreateInventoryInput {
  productId: ID!
  inventory: InventoryInput!
}

# Query
type Query {
  getInventoryStatuses: InventoryStatuses!
  getInventory(inventoryId: ID!): Inventory!
  getInventories(input: GetInventoriesInput): PaginatedInventories!
}

# Mutation Type
type Mutation {
  adjustStock(input: AdjustStockInput!): Inventory!
  createInventory(input: CreateInventoryInput!): Inventory!
}
