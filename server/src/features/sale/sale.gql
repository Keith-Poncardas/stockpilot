
"""
Represents the current lifecycle status of a sale transaction.
"""
enum SaleStatus {
    PENDING
    COMPLETED
    REFUNDED
    VOIDED
}

"""
Available payment methods that can be used for a transaction.
"""
enum PaymentMethod {
    CASH
    GCASH
    BANK_TRANSFER
    CREDIT_CARD
    DEBIT_CARD
}

"""
Fields available for sorting the sales list.
"""
enum SaleOrderBy {
    saleDate
    totalAmount
}

"""
Represents a complete sale record including customer and item details.
"""
type Sale {
    id: ID!
    customerId: ID!
    userId: ID!
    status: SaleStatus!
    totalAmount: Float!
    paymentMethod: PaymentMethod!
    saleDate: String!
    createdAt: String!
    updatedAt: String!

    # Relations
    saleItems: [SaleItem!]!
    customer: Customer
    author: User!
}

"""
Represents an individual line item within a sale transaction.
"""
type SaleItem {
    id: ID!
    saleId: ID!
    productId: ID!
    quantity: Int!
    unitPrice: Float!

    # Relation
    product: Product!
}

"""
Key performance indicators and aggregated metrics for sales.
"""
type SaleMetrics {
    totalRevenue: Float!
    totalTransactions: Int!
    completedSales: Int!
    refundedOrVoidedCount: Int!
}


"""
Represents a single row in the sales overview.
"""
type SaleOverviewRow {
    label: String!
    date: String!
    sales: Float!
    isActive: Boolean!
}

"""
Represents a sales ranked by location.
"""
type SaleLocationRanking {
    cityCode: String!
    name: String!
    revenue: Float!
    percentage: Float!
    rank: Int!
}

"""
Aggregated metrics for a customer's purchase history.
"""
type CustomerPurchaseSummary {
    totalOrders: Int!
    totalSpent: Float!
    averageOrderValue: Float!
    firstPurchase: String!
    lastPurchase: String!
}

"""
Response wrapper for paginated sales data, including pagination metadata.
"""
type PaginatedSales {
    data: [Sale!]!
    meta: Pagination!
}

"""
Filter criteria for querying the sales list.
"""
input GetSalesFilter {
    search: String
    customerId: ID
    status: SaleStatus
    paymentMethod: PaymentMethod
    dateFrom: String
    dateTo: String
    orderBy: SaleOrderBy
    orderDirection: OrderDirection
}

"""
Input parameters for retrieving a paginated list of sales.
"""
input PaginatedSalesInput {
    page: Int!
    limit: Int!
    filter: GetSalesFilter!
}

"""
Optional filters applied when computing sales metrics, such as a date range.
"""
input GetSalesMetricsFilter {
    dateFrom: String
    dateTo: String
}

"""
Input data required for an individual line item when creating a sale.
"""
input CreateSaleItemInput {
    productId: ID!
    quantity: Int!
    unitPrice: Float!
}

"""
Input data required to create a new sale transaction.
"""
input CreateSaleInput {
    customerId: ID
    paymentMethod: PaymentMethod!
    status: SaleStatus
    items: [CreateSaleItemInput!]!
}

"""
Input data required for changing the status of an existing sale.
"""
input ChangeSaleStatusInput {
    saleId: ID!
    status: SaleStatus!
}

"""
Available GraphQL queries for the sales module.
"""
type Query {
    getSale(saleId: ID!): Sale!
    getSales(args: PaginatedSalesInput!): PaginatedSales!
    getSalesMetrics: SaleMetrics!
}

"""
Available GraphQL mutations for the sales module.
"""
type Mutation {
    createSale(input: CreateSaleInput!): Sale!
    changeSaleStatus(input: ChangeSaleStatusInput!): Sale!
}

