
    # Response after successful auth operation (login or change password)
    type AuthResponse {
        user: User!
        token: String!
    }

    # User login input
    input LoginInput {
        email: String!
        password: String!
    }

    # Change password input
    input ChangePasswordInput {
        email: String!
        newPassword: String!
        confirmPassword: String!
    }

    # Query to get current authenticated user
    type Query {
        me: User
    }

    # Forgot password response
    type ForgotPasswordResponse {
        id: ID!
        email: String!
    }

    # Sign up input
    input SignUpInput {
        firstName: String!
        lastName: String!
        email: String!
        password: String!
    }

    # Verify OTP REGISTRATION input
    input VerifyOtpRegistrationInput {
        email: String!
        otp: String!
    }

    # Resend OTP input
    input ResendOtpInput {
        email: String!
    }

    # Forgot Password input
    input ForgotPasswordInput {
        email: String!
    }

    # Verify Forgot Password OTP input
    input VerifyForgotPasswordOtpInput {
        email: String!
        otp: String!
    }

    # Pending Registration type
    type PendingRegistration {
        id: ID!
        email: String!
        firstName: String!
        lastName: String!
        expiresAt: String!
    }

    # Password Reset type
    type PasswordReset {
        id: ID!
        email: String!
        expiresAt: String!
    }

    # Mutations for authentication
    type Mutation {
        login(input: LoginInput!): AuthResponse!
        changePassword(input: ChangePasswordInput!): User!
        signUp(input: SignUpInput!): PendingRegistration!
        verifyOtpRegistration(input: VerifyOtpRegistrationInput!): AuthResponse!
        resendOtpSignUp(input: ResendOtpInput!): PendingRegistration!
        resendOtpForgotPassword(input: ResendOtpInput!): PasswordReset!
        forgotPassword(input: ForgotPasswordInput!): ForgotPasswordResponse!
        verifyForgotPasswordOtp(input: VerifyForgotPasswordOtpInput!): ForgotPasswordResponse!
    }

