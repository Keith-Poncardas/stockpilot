"""
Response payload for a pending user registration containing the user's details and OTP expiration.
"""
type PendingRegistrationResponse {
    id: String!
    firstName: String!
    lastName: String!
    email: String!
    expiresAt: String!
    createdAt: String!
}

"""
Response payload for a password reset request containing the OTP expiration details.
"""
type PasswordResetResponse {
    id: String!
    email: String!
    expiresAt: String!
    createdAt: String!
}

"""
Response payload for successful authentication containing the user details and JWT token.
"""
type AuthResponse {
    user: User!
    token: String!
}

"""
Input parameters for user login authentication.
"""
input LoginInput {
    email: String!
    password: String!
}

"""
Input parameters for creating a new user account.
"""
input SignUpInput {
    firstName: String!
    lastName: String!
    email: String!
    password: String!
}

"""
Input parameters for verifying a user registration OTP.
"""
input VerifyOtpRegistrationInput {
    email: String!
    otp: String!
}

"""
Input parameters for resending a sign-up or password reset OTP.
"""
input ResendOtpSignUpInput {
    email: String!
}

"""
Input parameters for changing a user's password.
"""
input ChangesPasswordInput {
    email: String!
    newPassword: String!
    confirmPassword: String!
}

"""
Root query operations for authentication and user sessions.
"""
type Query {
    me: User!
}

"""
Root mutation operations for authentication and account management.
"""
type Mutation {
    login(input: LoginInput!): AuthResponse!
    signup(input: SignUpInput): PendingRegistrationResponse!
    verifyOtpRegistration(input: VerifyOtpRegistrationInput): AuthResponse!
    resendOtpSignUp(input: ResendOtpSignUpInput): PendingRegistrationResponse!
    resendOtpForgotPassword(input: ResendOtpSignUpInput): PasswordResetResponse!
    forgotPassword(input: ResendOtpSignUpInput): PasswordResetResponse!
    verifyForgotPasswordOtp(input: VerifyOtpRegistrationInput): PasswordResetResponse!
    changePassword(input: ChangesPasswordInput): User!
}