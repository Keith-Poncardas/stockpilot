"""
Defines the fields by which customers can be ordered.
"""
enum CustomerOrderBy {
    createdAt
    firstName
    lastName
}

"""
Represents a customer in the system, including personal details, address, and related purchase history.
"""
type Customer {
    id: ID!
    firstName: String
    lastName: String
    phone: String
    email: String
    addressLine1: String
    addressLine2: String
    provinceCode: String
    cityCode: String
    barangayCode: String
    postalCode: String
    country: String
    createdAt: String!
    updatedAt: String!

    # Relations
    purchaseSummary: CustomerPurchaseSummary!
    purchaseHistory(args: PaginatedSalesInput!): PaginatedSales!
}

"""
Aggregated metrics and key performance indicators for customers, useful for dashboard displays.
"""
type CustomerMetrics {
    totalCustomers: Int!
    newCustomers: Int!
    totalRevenue: Float!
    returningCustomers: Int!
}

"""
Response wrapper for paginated customer data, including the list of customers and pagination metadata.
"""
type PaginatedCustomers {
    data: [Customer!]!
    meta: Pagination!
}

"""
Response wrapper for cursor-based infinite scrolling of customer search results.
"""
type InfiniteCustomerSearchResult {
    data: [Customer!]!
    meta: InfiniteScrollMeta!
}

"""
Input parameters for filtering and sorting the customer list.
"""
input GetCustomersFilter {
    search: String
    dateFrom: String
    dateTo: String
    orderBy: CustomerOrderBy
    orderDirection: OrderDirection
}

"""
Input arguments for fetching a paginated list of customers.
"""
input PaginatedCustomersInput {
    page: Int!
    limit: Int!
    filter: GetCustomersFilter!
}

"""
Input data required to create a new customer record.
"""
input CreateCustomerInput {
    firstName: String!
    lastName: String!
    phone: String
    email: String
    addressLine1: String
    addressLine2: String
    provinceCode: String!
    cityCode: String!
    barangayCode: String!
    postalCode: String
}

"""
Input parameters for searching customers using infinite scroll.
"""
input SearchCustomersInput {
    search: String
    cursor: String
    limit: Int
}

"""
Root queries for fetching customer data, metrics, and search results.
"""
type Query {
    getCustomer(id: ID!): Customer!
    getCustomers(args: PaginatedCustomersInput!): PaginatedCustomers!
    getCustomerMetrics: CustomerMetrics!
    searchCustomers(args: SearchCustomersInput!): InfiniteCustomerSearchResult!
}

"""
Root mutations for creating and managing customers.
"""
type Mutation {
    createCustomer(input: CreateCustomerInput!): Customer!
}
