"""
Sales Overview Period Enum
"""
enum SalesOverviewPeriod {
    DAILY
    WEEKLY
    MONTHLY
    YEARLY
}

"""
Sort Order Enum
"""
enum SortOrder {
    HIGH
    LOW
}

"""
Dashboard Metrics Type
"""
type DashboardMetrics {
    totalSales: Float!
    totalProducts: Int!
    totalCustomers: Int!
    totalUnitsInStock: Int!
}

"""
Get sales by location input type
"""
input GetSalesByLocationInput {
    sort: SortOrder!
    limit: Int
}

"""
Query Type
"""
type Query {
    dashboardMetrics: DashboardMetrics!
    getSalesOverview(period: SalesOverviewPeriod!, productId: ID): [SaleOverviewRow!]!
    getSalesByLocation(input: GetSalesByLocationInput!): [SaleLocationRanking!]!
    getTopSellingProducts(sort: SortOrder!): [ProductRankedSales!]!
    recentSales: PaginatedSales!
    lowStockAlerts: PaginatedInventories!
}